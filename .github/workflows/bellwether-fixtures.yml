name: Bellwether Fixtures

# bellwether (smg-project/bellwether) records, for each model at a pinned
# Hugging Face revision, what the checkpoint's own template and tokenizer give:
# the prompt token ids of a request, and the text of an output token by token.
# The tests named bellwether_* read those fixtures and skip without them: the
# gateway's chat request path, Symphony's parsers, and the tokenizer crate's
# encode and incremental decode. This workflow runs them on every change to
# the code they judge (the protocol crate, the tokenizer crate, the gRPC
# router, Symphony) and to the dependencies, so a difference shows on the pull
# request that makes it.
#
# The fixtures come from the bellwether commit in
# .github/versions/bellwether.ref. To move to newer fixtures, change that hash:
# the pull request that does it runs against the new commit. bellwether keeps
# its benchmark sets compressed, so the job unpacks the fixture tree with
# bellwether's own command and the tests read the plain copy. A set that is
# compressed is fetched from bellwether's LFS store by that command, which
# needs the token in that step once such sets are pinned; today every pinned
# set is plain.
#
# bellwether is private, so the checkout needs the BELLWETHER_READ_TOKEN secret
# (read access to that repository's contents). A pull request from a fork, or
# one Dependabot opened, is not given the repository's secrets: the job says so
# and passes without running the tests, and the push to main after the merge
# runs them. Any other run without the token fails, so a secret that is
# missing or has expired cannot pass for tests that ran.
on:
  push:
    branches: [ main ]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request and one per branch: a newer push cancels the
# superseded run. Keep the pull request form in sync with
# cancel-pr-workflows.yml.
concurrency:
  group: bellwether-fixtures-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fixture-tests:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The tests below run this pull request's code, so the workflow token is
      # not left in the checkout's git configuration.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A secret cannot be read in an `if:`, so this step turns "is the token
      # there" into an output the later steps test.
      - name: Read the pinned bellwether commit
        id: pin
        env:
          BELLWETHER_READ_TOKEN: ${{ secrets.BELLWETHER_READ_TOKEN }}
          GIVEN_NO_SECRETS: >-
            ${{ github.event_name == 'pull_request'
                && (github.event.pull_request.head.repo.full_name != github.repository
                    || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          ref="$(tr -d '[:space:]' < .github/versions/bellwether.ref)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/versions/bellwether.ref::expected one 40-character commit hash"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ -n "$BELLWETHER_READ_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$GIVEN_NO_SECRETS" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A pull request from a fork or from Dependabot is not given BELLWETHER_READ_TOKEN, so the bellwether tests did not run here. The push to main runs them."
          else
            echo "::error::BELLWETHER_READ_TOKEN is not set, so the bellwether tests cannot run. Add it as a repository secret with read access to smg-project/bellwether's contents."
            exit 1
          fi

      - name: Check out bellwether
        if: steps.pin.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: smg-project/bellwether
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.BELLWETHER_READ_TOKEN }}
          path: .bellwether
          persist-credentials: false

      # The plain fixture tree, as the tests read it: each model's manifest,
      # its table of sets, and the sets as JSON Lines.
      - name: Install uv
        if: steps.pin.outputs.available == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .bellwether/uv.lock

      - name: Unpack the fixtures
        if: steps.pin.outputs.available == 'true'
        run: uv run --project .bellwether bellwether unpack --fixtures .bellwether/fixtures --out .bellwether/fixtures-plain

      # This job builds three test targets and nothing else, so it keeps its
      # own cache entry instead of racing the full builds for theirs.
      - name: Setup Rust
        if: steps.pin.outputs.available == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: bellwether-fixtures

      # The tests fetch each model's tokenizer files from Hugging Face once, at
      # the revision its manifest pins, into these directories. Which files
      # are there depends on the manifests and on the list each test asks for,
      # so the key is the hash of both: moving the pin to a commit with the
      # same models stores nothing new, and a test that asks for one more file
      # gets a new entry that starts from the old one.
      - name: Cache tokenizer files
        if: steps.pin.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: |
            crates/tokenizer/.tokenizer_cache/bellwether
            model_gateway/.tokenizer_cache/bellwether
          key: bellwether-tokenizers-${{ hashFiles('.bellwether/fixtures/*/manifest.toml', 'model_gateway/tests/bellwether_*.rs', 'crates/tokenizer/tests/bellwether_*.rs') }}
          restore-keys: |
            bellwether-tokenizers-

      # One invocation, so the test targets build with the same features (the
      # tokenizer files are downloaded over the TLS backend the gateway
      # enables), and the pattern takes in every test file named bellwether_*
      # in these crates.
      - name: Run the tests that read bellwether
        if: steps.pin.outputs.available == 'true'
        timeout-minutes: 45
        env:
          BELLWETHER_FIXTURES: ${{ github.workspace }}/.bellwether/fixtures-plain
        run: |
          source "$HOME/.cargo/env"
          cargo test -p llm-tokenizer -p smg -p smg-symphony --test 'bellwether_*' -- --nocapture

      - name: Show sccache stats
        if: always() && steps.pin.outputs.available == 'true'
        run: sccache --show-stats
